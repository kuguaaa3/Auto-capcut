name: Local contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inspection tools on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Install inspection tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue) -or -not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inspection tool installation failed' }
          }
      - name: Require real inspection binaries
        run: python -c "import shutil; assert shutil.which('ffprobe') and shutil.which('ffmpeg'), 'Inspection binaries are required for CI'"
      - name: Compile local tools
        run: python -m compileall -q skills/auto-capcut/scripts scripts
      - name: Test public local contracts (not CapCut acceptance)
        run: python -m unittest discover -s tests -v

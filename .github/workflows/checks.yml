name: Local contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile local tools
        run: python -m compileall -q skills/auto-capcut/scripts
      - name: Test public local contracts (not CapCut acceptance)
        run: python -m unittest discover -s tests -v
